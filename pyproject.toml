[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "republica-gnomofica"
version = "0.1.0"
description = "Infraestructura local-first para la curiosidad."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31,<3",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
]
voice = [
    "SpeechRecognition[audio]>=3.10,<4",
    "pyttsx3>=2.90,<3",
]
web = [
    "Flask>=3.1.3,<4",
    "waitress>=3.0.2,<4",
]

[project.scripts]
republica = "main:main"
miku = "main:miku_main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cli*", "core*", "gnomos*", "miku*", "profiles*", "providers*"]

[tool.setuptools.package-data]
"profiles.miku" = ["*.md", "*.toml", "memories/*.md"]
"miku.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
